<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Running Duck Game</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <h1>Running Duck Game</h1>
    <p>Score: <span id="score">0</span></p>
    <div id="game-container">
      <div id="duck"></div>
    </div>

    <script>
      $(document).ready(function () {
          let isJumping = false;
          let score = 0;

          $(document).keydown(function (event) {
              if (event.key === ' ' && !isJumping) {
                  isJumping = true;
                  $('#duck').animate({ bottom: '100px' }, 300, function () {
                      $('#duck').animate({ bottom: '10px' }, 300, function () {
                          isJumping = false;
                      });
                  });
              }
          });

          function createObstacle() {
              let obstacle = $('<div class="obstacle"></div>');
              $('#game-container').append(obstacle);
              obstacle.css('right', '-50px');

              obstacle.animate({ right: '100vw' }, 3000, 'linear', function () {
                  $(this).remove();
              });
          }

          function createCoin() {
              let coin = $('<div class="coin"></div>');
              let coinHeight = Math.random() * 100 + 50;
              $('#game-container').append(coin);
              coin.css({ right: '-50px', bottom: coinHeight + 'px' });

              coin.animate({ right: '100vw' }, 3000, 'linear', function () {
                  $(this).remove();
              });
          }

          setInterval(createObstacle, 2000);
          setInterval(createCoin, 5000);
      });
    </script>
  </body>
</html>
