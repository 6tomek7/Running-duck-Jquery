<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Running Duck Game</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <h1>Running Duck Game</h1>
    <button id="play-button">Play</button>
    <div id="game-container">
      <div class="top-bar">
        <p>Score: <span id="score">0</span></p>
        <p>Level: <span id="level">1</span></p>
      </div>
        <img id="duck" class="duck" src="assets/duck_1.png"></img>
        <img id="speakerIcon" src="assets/unmute.png" alt="Unmute">
        <div class="floor"></div>
    </div>
    
    <script src="js/duck.js"></script>
    <script src="js/coin.js"></script>
    <script src="js/obstacle.js"></script>
    <script src="js/cloud.js"></script>
    <script src="js/game.js"></script>
    <script src="js/sound.js"></script>
    
    <audio id="coin-sound" src="assets/coin-257878.mp3" preload="auto"></audio>
    <audio id="quacking-sound" src="assets/quacking.mp3" preload="auto"></audio>
    <audio id="game-over-sound" src="assets/videogame-death-sound-43894.mp3" preload="auto"></audio>
    <audio id="win-game-sound" src="assets/win_game.mp3" preload="auto"></audio>
    <audio id="next-level-sound" src="assets/new-level.mp3" preload="auto"></audio>
  </body>
</html>
